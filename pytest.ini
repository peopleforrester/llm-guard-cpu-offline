[pytest]
# src/ holds the vendored llm_guard_api package as `app`; the repo root makes `tests` importable.
pythonpath = src .
testpaths = tests/unit
addopts = -ra --strict-markers
# Third-party, raised in the E2E install: starlette's TestClient on current anyio, and a regex
# string in llm_guard/util.py. Neither is code this repository owns or vendors.
filterwarnings =
    ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient
    ignore:invalid escape sequence:SyntaxWarning
